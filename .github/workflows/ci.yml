name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · content · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The editorial gate: a published report that does not cite a source, or a
      # citation that points at nothing, fails here rather than reaching the site.
      - name: BPL crawler metadata and images
        run: pnpm test:bpl:images

      - name: Validate content
        run: pnpm content:validate

      - name: Build
        run: pnpm build

      - name: Install browser for BPL navigation regressions
        run: pnpm exec playwright install --with-deps chromium

      - name: BPL browser Back/Forward and share regressions
        env:
          BPL_SCREENSHOT_OUTPUT: /tmp/bpl-browser-screenshots
        run: |
          pnpm start > /tmp/stepwire-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/bpl > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:bpl:browser

      - name: Save BPL desktop and mobile visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpl-browser-screenshots
          path: /tmp/bpl-browser-screenshots
          if-no-files-found: warn
          retention-days: 7

      # Exercises the collector end to end against repository fixtures. No
      # network requests, no issues created — this only proves the pipeline
      # still normalises, deduplicates and formats correctly.
      - name: Collector smoke test (fixtures only)
        run: pnpm news:collect --dry-run --source fixture-official,fixture-community,fixture-json
