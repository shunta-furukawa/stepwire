# STEPWIRE source registry
#
# Adding a source is a pull request against this file — no code change.
# See docs/sources.md for the full guide.
#
# Fields
#   id                lowercase-kebab-case, stable forever (it seeds collector IDs,
#                     so changing it re-collects everything from that source)
#   name              human-readable name, shown in the issue and in attribution
#   type              rss | atom | json | fixture   (html and manual are not implemented — see docs/sources.md)
#   url               feed URL, or a repo-relative path for type: fixture
#   enabled           false by default. Enable deliberately, one source at a time.
#   category          official | media | community  → becomes the source:* issue label
#   suggestedCategory the STEPWIRE category a human will most often pick for this source
#   maxItems          per-run cap for this source (default 10)
#   homepage          attribution link
#   notes             terms, rate limits, contact — anything a future reviewer needs
#
# POLICY: STEPWIRE prefers official feeds, official APIs and public feeds.
# HTML scraping is not implemented and is not added casually; see docs/sources.md.

sources:
  # ---------------------------------------------------------------------------
  # Fixtures. Always enabled: they are how the pipeline is exercised in CI and
  # locally without sending a single request to anyone's server.
  # ---------------------------------------------------------------------------
  - id: fixture-official
    name: STEPWIRE Fixture — Official Feed (sample)
    type: fixture
    url: data/fixtures/official-feed.xml
    enabled: true
    category: official
    suggestedCategory: UPDATE
    maxItems: 10
    notes: >-
      Sample RSS document with invented DDR announcements. Used by tests and by
      `pnpm news:collect --dry-run`. Contains no real news.

  - id: fixture-community
    name: STEPWIRE Fixture — Community Feed (sample)
    type: fixture
    url: data/fixtures/community-feed.atom
    enabled: true
    category: community
    suggestedCategory: COMMUNITY
    maxItems: 10
    notes: Sample Atom document with invented community posts.

  - id: fixture-json
    name: STEPWIRE Fixture — JSON API (sample)
    type: fixture
    url: data/fixtures/chart-releases.json
    enabled: true
    category: official
    suggestedCategory: CHARTS
    maxItems: 10
    options:
      itemsPath: releases
      fields:
        url: link
        title: name
        summary: note
        publishedAt: released_at
    notes: >-
      Demonstrates the JSON adapter's configurable field mapping — an official
      JSON API can be added without writing a new adapter.

  # ---------------------------------------------------------------------------
  # Real sources. Each was fetched and inspected before being enabled; see the
  # notes for what was checked and when. Neither is DDR-specific, so both carry
  # a filter — that is what keeps the inbox short enough to triage.
  # ---------------------------------------------------------------------------
  - id: bemaniwiki
    name: BEMANIWiki 2nd
    type: rss
    url: https://bemaniwiki.com/index.php?cmd=rss&ver=2.0
    enabled: true
    category: community
    suggestedCategory: UPDATE
    homepage: https://bemaniwiki.com/
    maxItems: 10
    filter:
      # The feed is the wiki's RecentChanges across every BEMANI series, so the
      # filter is what makes it a DDR source rather than a firehose.
      include:
        - DanceDanceRevolution
        - DDR
      exclude:
        # Navigation and container pages are edited constantly and never carry
        # news of their own.
        - MenuBar
        - RecentChanges
        - SandBox
        - コメント/
    notes: >-
      Community wiki covering the BEMANI series, including DDR. Verified
      2026-08-30: RSS 2.0 at ver=2.0 (the default is RSS 0.91 and omits
      pubDate). robots.txt declares only a Sitemap and no Disallow. An edit to a
      DDR page is a signal that something changed, not a report — treat every
      candidate as a lead to verify against a first-party source.
      WINDOW: the feed returns a fixed 15 items regardless of any limit
      parameter, which at observed edit rates is roughly two hours. The
      four-hourly schedule therefore samples this feed rather than reading all
      of it. That is acceptable because a real DDR change produces a burst of
      edits across several pages over hours or days, so at least one lands in
      some window — but do not treat this source as complete.

  - id: ddrcommunity
    name: DDRCommunity
    type: rss
    url: https://ddrcommunity.com/feed/
    enabled: true
    category: community
    suggestedCategory: NEWS
    homepage: https://ddrcommunity.com/
    maxItems: 10
    # No filter: this is the one source found so far that is DDR-only, so
    # everything it publishes is on-topic by construction.
    notes: >-
      English-language DDR community news site (WordPress). Verified 2026-08-30:
      RSS 2.0 with proper pubDate, 10 items per window, headlines already tagged
      by title ("[DDR WORLD] …", "[DDR GRAND PRIX] …"). robots.txt disallows only
      /wp-admin/. The highest signal-to-noise source in this registry — but it is
      a community outlet, not a first-party one, so a story sourced here should
      still be traced back to the announcement it reports.

  - id: 4gamer
    name: 4Gamer.net
    type: rss
    url: https://www.4gamer.net/rss/index.xml
    enabled: true
    category: media
    suggestedCategory: NEWS
    homepage: https://www.4gamer.net/
    maxItems: 10
    filter:
      include:
        - DanceDanceRevolution
        - DDR
        - ダンスダンスレボリューション
        - BEMANI
    notes: >-
      General games media. Verified 2026-08-30: RSS 1.0 (RDF), robots.txt allows
      all. DDR appears rarely, so the filter usually removes every item — that is
      the intended behaviour and costs one request per run.

  # ---------------------------------------------------------------------------
  # Checked and NOT enabled. Recorded so nobody re-investigates them.
  # ---------------------------------------------------------------------------
  - id: bemani-youtube
    name: BEMANI CHANNEL (YouTube)
    type: youtube
    # Not a URL: the youtube adapter builds the request itself, because the API
    # key is a secret and must never appear in this committed file.
    url: youtube-data-api-v3
    enabled: false
    category: official
    suggestedCategory: NEWS
    homepage: https://www.youtube.com/@bemaniproleague
    maxItems: 10
    options:
      # BEMANI CHANNEL. The adapter reads its uploads playlist (UC… -> UU…).
      channelId: UCVbHFsn9ymFxkT7xsFVE17Q
    filter:
      include:
        - DanceDanceRevolution
        - DDR
        - BPL
        - BEMANI PRO LEAGUE
    notes: >-
      KONAMI's official BEMANI channel, and where BEMANI PRO LEAGUE matches are
      streamed. Collected through the YouTube Data API v3, NOT the Atom feed at
      /feeds/videos.xml, which YouTube's robots.txt disallows for all agents.
      playlistItems.list costs 1 quota unit against a 10,000/day default, so the
      four-hourly schedule spends about 6 units a day.
      TO ENABLE: create a Google Cloud project, enable "YouTube Data API v3",
      create an API key, then set YOUTUBE_API_KEY locally in .env.local and as a
      GitHub Actions secret. Verify with
      `pnpm news:collect --dry-run --source bemani-youtube`, then flip enabled to
      true in its own PR. Until the key exists the source reports one warning per
      run and collection of every other source is unaffected.

  - id: bpl-official
    name: BEMANI PRO LEAGUE (official site)
    type: manual
    url: https://p.eagate.573.jp/game/bpl/
    enabled: false
    category: official
    suggestedCategory: TOURNAMENT
    homepage: https://p.eagate.573.jp/game/bpl/
    notes: >-
      The official BPL site. Verified 2026-08-30: the page returns HTTP 200 but
      declares no RSS or Atom link at all, and the eagate domain sits behind a
      WAF with no robots.txt. There is nothing to poll. BPL schedules and results
      reach the inbox either by hand via the News candidate template, or
      indirectly through ddrcommunity and bemaniwiki, both of which cover BPL.
      Recorded as a source so its absence is a documented decision.

  - id: reddit-ddr
    name: r/DanceDanceRevolution
    type: atom
    url: https://old.reddit.com/r/DanceDanceRevolution/.rss
    enabled: false
    category: community
    suggestedCategory: COMMUNITY
    homepage: https://www.reddit.com/r/DanceDanceRevolution/
    maxItems: 10
    notes: >-
      DDR-specific and well suited to this pipeline, but Reddit rate-limits
      datacenter IPs: verified 2026-08-30, www returned 429 and old.reddit
      returned 200 only intermittently. A GitHub Actions runner is also a
      datacenter IP, so enabling this would mostly add a failing source to every
      run. Revisit with an authenticated Reddit API client.
